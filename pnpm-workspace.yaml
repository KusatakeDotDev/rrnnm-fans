packages:
  - .

allowBuilds:
  esbuild: true
  workerd: true

# 新しい依存を pnpm add で足したとき、範囲ではなく catalog: で書かせる（ADR-0017「`catalog:` で指すことを守らせる」）
# 下の一覧のうち catalog にも同じ名前があるものは、pnpm add・pnpm --filter … update で上げると止まる（ADR-0017「払うもの」）
catalogMode: strict

# 何を書くかは docs/adr/0017-dependency-notes-in-catalog.md。
# catalog に入れず、package.json に直接書くもの（tests/repo/catalog-specifiers.test.ts がこの一覧を読む）:
# （今は無い）
catalog:
  "@astrojs/check": ^0.9.10
  "@astrojs/react": ^7.0.1
  "@astrojs/sitemap": ^3.7.4
  "@axe-core/playwright": ^4.13.0
  "@fontsource/zen-maru-gothic": ^5.3.1

  # Why: CI のイメージのタグ（ci.yml の container:）と同じバージョンにする（ADR-0013 の決定）
  # RemoveWhen: ADR-0013「見直す条件」で、イメージのタグを手で直さなくてよくなったとき
  "@playwright/test": ^1.63.0

  "@storybook/addon-a11y": ^10.6.1
  "@storybook/addon-docs": ^10.6.1
  "@storybook/addon-vitest": ^10.6.1
  "@storybook/react-vite": ^10.6.1
  "@stryker-mutator/core": ^10.1.1
  "@stryker-mutator/vitest-runner": ^10.1.1
  "@types/node": ^26.6.5
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0

  # Why: addon-vitest が optional peer として読み込むので、直接持つ（ADR-0003「導入した依存」）。バージョンは vite-plus の中のものと同じにする（ADR-0031「Vitest と Vite のバージョンは、vite-plus の中のものにそろえる」）
  # RemoveWhen: addon-vitest が @vitest/browser/context を読み込まなくなるか、依存として持つようになったとき
  "@vitest/browser": 5.0.5

  # Why: vite-plus がブラウザーモードの peer として求める。バージョンは vite-plus が求めるものと同じにする（ADR-0031「Vitest と Vite のバージョンは、vite-plus の中のものにそろえる」）
  # RemoveWhen: コンポーネントのテストを、Vitest のブラウザーモードで回さなくなったとき
  "@vitest/browser-playwright": 5.0.5

  astro: ^7.3.8
  fast-check: ^4.10.2

  # Why: CI のイメージのタグ（ci.yml の container:）と同じバージョンにする（ADR-0013 の決定）
  # RemoveWhen: ADR-0013「見直す条件」で、イメージのタグを手で直さなくてよくなったとき
  playwright: ^1.63.0

  # Why: 自前の .astro の <style> を読む Stylelint の構文が import するので、直接持つ（ADR-0025「依存は、ADR-0016 の4項目を添えて主に聞いた」）
  # RemoveWhen: 自前の構文をやめるとき
  postcss: ^8.5.28

  react: ^19.3.0
  react-dom: ^19.3.0
  sharp: ^0.35.5
  storybook: ^10.6.1
  stylelint: ^17.16.0

  # Why: 下限の iOS 18 で読めない CSS の機能を、書いたときに止める（ADR-0025「下限で読めない機能は、Baseline 2024 で lint する」）
  # RemoveWhen: Stylelint が Baseline のルールを組み込みにしたとき（ADR-0025「見直す条件」）
  stylelint-plugin-use-baseline: ^1.4.7

  # Why: メジャーを 6 に留める（.github/dependabot.yml の ignore。ADR-0003「TypeScript は 6 系に留める」）
  # RemoveWhen: ADR-0003「TypeScript は 6 系に留める」の見直しの条件を満たしたとき
  typescript: ^6.0.3

  # Why: overrides で、Astro・Storybook・Vitest が使う Vite を、vite-plus の中のもの（vite-plus-core）にする。バージョンは vite-plus と同じにする（ADR-0031「Vitest と Vite のバージョンは、vite-plus の中のものにそろえる」）
  # RemoveWhen: ADR-0031「見直す条件」で、Vite+ をやめるとき
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0

  # Why: vitest・@vitest/* と overrides の行き先を、このバージョンの中のものにそろえるので、範囲にしない（ADR-0031「Vitest と Vite のバージョンは、vite-plus の中のものにそろえる」）
  # RemoveWhen: ADR-0031「見直す条件」で、Vite+ をやめるとき
  vite-plus: 1.4.0

  # Why: Stryker と addon-vitest が peer として読むので、直接持つ。バージョンは vite-plus の中のものと同じにし、overrides で1つにする（ADR-0031「Vitest と Vite のバージョンは、vite-plus の中のものにそろえる」）
  # RemoveWhen: Stryker と addon-vitest が vitest を peer として読まなくなったとき
  vitest: 5.0.5

  wrangler: ^4.149.0

# Vitest は peer の Vite ごとに別のものとして入るので、Vite もそろえないと、テストのファイルが登録する先と Stryker が回すものが別になる
# （ADR-0031「Vitest と Vite のバージョンは、vite-plus の中のものにそろえる」）
overrides:
  "vite@*": "catalog:"
  "vitest@*": "catalog:"

# peer の Vite の範囲（^8 など）が、vite-plus-core のバージョン（1.x）と比べられて外れるため。中の Vite のバージョンは tests/repo/vite-plus.test.ts が見る
peerDependencyRules:
  allowAny:
    - vite
  # Storybook の optional peer の範囲が 0.x のままで外れるため。Storybook は vite-plus/versions を読むだけで、1.x にもある
  allowedVersions:
    storybook>vite-plus: ^1.4.0
